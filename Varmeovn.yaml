# Set heater_watts to the rated power of your heater (whole watts).
substitutions:
  devicename: "navn"
  heater_watts: "900"

esphome:
  name: $devicename
  min_version: 2025.11.0

esp8266:
  board: d1_mini

external_components:
  - source:
      type: git
      url: https://github.com/JDolven/Replacing-HF_LPT120A-in-a-millheat-heater
    components: [mill]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${devicename} Fallback Hotspot"
    password: !secret fallback_wifi_pw

captive_portal:

# Enable logging. The heater is on the hardware UART (GPIO1/GPIO3), so serial logging must stay off.
logger:
  level: DEBUG
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: !secret Secret_KEY

ota:
  - platform: esphome
    password: !secret HA_API

climate:
  - platform: mill
    name: ${devicename} Heater
    id: heater
    uart_id: uart_bus
    # Show Wi-Fi / Home Assistant connection on the heater's Wi-Fi icon (see PROTOCOL.md).
    wifi_icon: false
    # Log every UART frame in hex, and which status bytes changed. Useful for mapping the protocol.
    sniffer: false
    # Warn (and report 0 W below) when the heater has sent no status for this long.
    # Measure how often your heater sends status with sniffer: true before enabling this.
    # link_timeout: 5min
    on_state:
      - component.update: heater_power

uart:
  id: uart_bus
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600

sensor:
  - platform: total_daily_energy
    name: ${devicename} Daglig forbruk
    power_id: heater_power
    method: left

  - platform: template
    name: ${devicename} effekt
    id: heater_power
    lambda: |-
      if (id(heater).link_ok() && id(heater).action == CLIMATE_ACTION_HEATING) {
        return ${heater_watts}.0f;
      } else {
        return 0.0f;
      }
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s

time:
  - platform: sntp
    id: my_time
